version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENABLE_DOCS=false
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "80:80"
      - "5173:80" # Maps local dev port for convenience
    depends_on:
      - backend
    restart: unless-stopped
